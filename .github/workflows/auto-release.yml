name: Release and Docker Push

on:
    push:
        branches: [v3, v4, v5]
        paths: [package.json, package-lock.json]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
    prepare:
        name: Check release version
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            publish: ${{ steps.release.outputs.publish }}
            version: ${{ steps.release.outputs.version }}
            major: ${{ steps.release.outputs.major }}
            tag: ${{ steps.release.outputs.tag }}
            image: ${{ steps.release.outputs.image }}
            prerelease: ${{ steps.release.outputs.prerelease }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - name: Validate branch/version and check for an existing release
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  node --input-type=module <<'NODE'
                  import fs from 'node:fs'

                  const branch = /^refs\/heads\/v([345])$/.exec(process.env.GITHUB_REF ?? '')
                  if (!branch) throw new Error('Release only from v3, v4 or v5.')
                  const major = branch[1]
                  const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
                  const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
                  const version = pkg.version
                  const match = typeof version === 'string' && /^([345])\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/.exec(version)
                  const invalidPrerelease = match && match[4]?.split('.').some(part => /^\d+$/.test(part) && part.length > 1 && part.startsWith('0'))
                  if (!match || match[1] !== major || invalidPrerelease || version.length > 128) {
                      throw new Error(`package.json must contain a Docker-compatible ${major}.x version matching the branch.`)
                  }
                  if (lock.version !== version || lock.packages?.['']?.version !== version) {
                      throw new Error('package.json and package-lock.json versions must match.')
                  }
                  const tag = `v${version}`
                  const image = `${process.env.REGISTRY}/${process.env.GITHUB_REPOSITORY.toLowerCase()}`
                  const api = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`
                  async function lookup(route, allowMissing = false) {
                      const response = await fetch(`${api}/${route}`, {
                          headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
                          signal: AbortSignal.timeout(20000)
                      })
                      if (allowMissing && response.status === 404) return null
                      if (!response.ok) throw new Error(`${route} returned HTTP ${response.status}; refusing to publish.`)
                      return response.json()
                  }
                  const release = await lookup(`releases/tags/${tag}`, true)
                  const publish = release === null
                  if (publish) {
                      const ref = await lookup(`git/ref/tags/${tag}`, true)
                      let object = ref?.object
                      for (let depth = 0; object?.type === 'tag' && depth < 5; depth++) {
                          object = (await lookup(`git/tags/${object.sha}`)).object
                      }
                      if (object && (object.type !== 'commit' || object.sha !== process.env.GITHUB_SHA)) {
                          throw new Error(`${tag} already points to another commit. Bump the version; existing tags are never moved.`)
                      }
                  }
                  const output = { version, major, tag, image, prerelease: version.includes('-'), publish }
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(output).map(([key, value]) => `${key}=${value}\n`).join(''))
                  console.log(publish ? `Preparing ${tag}` : `${tag} already exists; publication skipped.`)
                  NODE

    validate:
        needs: prepare
        if: needs.prepare.outputs.publish == 'true'
        uses: ./.github/workflows/validate.yml

    deploy:
        name: Publish release
        needs: [prepare, validate]
        if: needs.prepare.outputs.publish == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
              with:
                  platforms: arm64
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Preserve an existing versioned image
              id: existing
              env:
                  IMAGE: ${{ needs.prepare.outputs.image }}
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: |
                  node --input-type=module <<'NODE'
                  import fs from 'node:fs'
                  import { spawnSync } from 'node:child_process'

                  const image = process.env.IMAGE
                  const version = process.env.VERSION
                  function inspect(ref, format) {
                      return spawnSync('docker', ['buildx', 'imagetools', 'inspect', ref, '--format', format], {
                          encoding: 'utf8', timeout: 60000
                      })
                  }
                  const result = inspect(`${image}:${version}`, '{{json .Manifest}}')
                  let exists = false
                  let digest = ''
                  if (result.error) throw result.error
                  if (result.status === 0) {
                      const manifest = JSON.parse(result.stdout)
                      digest = manifest.digest
                      if (!/^sha256:[a-f0-9]{64}$/.test(digest ?? '')) throw new Error('Image digest is missing or invalid.')
                      for (const architecture of ['amd64', 'arm64']) {
                          const platform = manifest.manifests?.find(item => item.platform?.os === 'linux' && item.platform.architecture === architecture)
                          if (!platform) throw new Error(`Existing image is missing linux/${architecture}; refusing to overwrite it.`)
                          const config = inspect(`${image}@${platform.digest}`, '{{json .Image}}')
                          if (config.error) throw config.error
                          if (config.status !== 0) throw new Error(config.stderr || 'Cannot read existing image labels.')
                          const labels = JSON.parse(config.stdout).config?.Labels ?? {}
                          if (labels['org.opencontainers.image.revision'] !== process.env.GITHUB_SHA ||
                              labels['org.opencontainers.image.version'] !== version ||
                              labels['org.opencontainers.image.source'] !== `https://github.com/${process.env.GITHUB_REPOSITORY}`) {
                              throw new Error(`Image ${version} already belongs to different or unverified code. Bump the version.`)
                          }
                      }
                      exists = true
                      console.log(`Reusing ${image}:${version} from this commit without overwriting it.`)
                  } else if (!/not found|manifest unknown|no such manifest/i.test(result.stderr)) {
                      throw new Error(result.stderr || 'Registry lookup failed; refusing to publish.')
                  }
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `exists=${exists}\ndigest=${digest}\n`)
                  NODE
            - name: Build and publish AMD64/ARM64 images
              id: build
              if: steps.existing.outputs.exists != 'true'
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
                  cache-from: type=gha,version=2,scope=release-v${{ needs.prepare.outputs.major }}
                  cache-to: type=gha,version=2,scope=release-v${{ needs.prepare.outputs.major }},mode=max
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
                      org.opencontainers.image.revision=${{ github.sha }}
            - name: Create GitHub release after the images are published
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
                  PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
              run: |
                  args=("$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes --latest=false)
                  if [ "$PRERELEASE" = 'true' ]; then
                    args+=(--prerelease)
                  fi
                  gh release create "${args[@]}"
            - name: Update only this major's stable Docker channel
              if: needs.prepare.outputs.prerelease != 'true'
              env:
                  IMAGE: ${{ needs.prepare.outputs.image }}
                  MAJOR: ${{ needs.prepare.outputs.major }}
                  DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
              run: |
                  docker buildx imagetools create --tag "$IMAGE:$MAJOR" "$IMAGE@$DIGEST"
