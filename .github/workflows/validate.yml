name: Validate

on:
    push:
        branches: [v3, v4, v5]
    pull_request:
        branches: [v3, v4, v5]
        types: [opened, synchronize, reopened, ready_for_review]
    merge_group:
        types: [checks_requested]
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: Build and static checks
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            # PRs use the merge with the target branch; no credentials are persisted.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: npm
            - name: Install locked dependencies
              run: npm ci --include=dev --ignore-scripts
            - name: Build, type check, lint and check formatting
              run: |
                  npm run build
                  npm run check:api --if-present
                  npm run lint --if-present
                  npm run format:check --if-present
